[workspace]
members = ["crates/core", "crates/protocol", "crates/top-dog", "plugins/firefox", "templates/rust-plugin"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
libc = "0.2"
toml = "0.8"
crossterm = "0.28"
unicode-width = "0.2"
top-dog-protocol = { path = "crates/protocol" }
top-dog-core = { path = "crates/core" }

